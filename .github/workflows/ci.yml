name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, review/gopro-baseline, review/product-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: LinuxRelease, os: ubuntu-latest, type: Release}
          - {name: LinuxDebug, os: ubuntu-latest, type: Debug}
          - {name: MacRelease, os: macos-latest, type: Release}
    steps:
      - uses: actions/checkout@v6
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev pkg-config
      - name: macOS desktop dependencies
        if: runner.os == 'macOS'
        run: brew install libraw ffmpeg pkg-config
      - name: Build SDK and tools
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }}
          cmake --build build --parallel 4
          if [ -f tools/gvid_mov/Makefile ]; then make -C tools/gvid_mov; fi
          if [ "$(uname -s)" = Darwin ] && [ -f tools/gpr2prores/Makefile ]; then
            make -C tools/gpr2prores GPR_BUILD="$PWD/build"
          fi
